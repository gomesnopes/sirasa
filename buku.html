<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Belajar & Evaluasi - KITA SEBAYA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        // Lokasi aset DearFlip (suara balik halaman, library) — tanpa ini dicari di root situs dan 404.
        var dFlipLocation = "https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/";
    </script>
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/themify-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>
    <script>
        // dflip.min.js menimpa DFLIP.defaults saat dimuat, jadi pengaturan harus diterapkan SETELAHNYA.
        Object.assign(DFLIP.defaults, { webgl: true, soundEnable: true, hideControls: "download,print,more,share,fullscreen,toggle,play" });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0f172a; font-family: sans-serif; }
        .modal-enter { animation: fadeIn 0.4s ease-out forwards; }
        .quiz-enter { animation: slideUp 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        ._df_book { height: 100vh !important; width: 100vw !important; margin: 0 !important; }
        input[type="radio"]:checked + span { color: #e11d48; font-weight: bold; }
        .radio-card:has(input[type="radio"]:checked) { border-color: #e11d48; background-color: #fff1f2; }

        /* ===== Mode Baca Teks ===== */
        #panel-teks { --bg:#ffffff; --fg:#1e293b; --muted:#64748b; --bar:#f8fafc; --line:#e2e8f0; --hl:#fef3c7; --aksen:#e11d48; background:var(--bg); color:var(--fg); }
        #panel-teks.tema-sepia { --bg:#f7f0e1; --fg:#3f301d; --muted:#86725a; --bar:#efe5cf; --line:#dccfb2; --hl:#f1dca0; --aksen:#b45309; }
        #panel-teks.tema-gelap { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --bar:#1e293b; --line:#334155; --hl:#3b3517; --aksen:#fb7185; }
        #panel-teks .panel-bar { background:var(--bar); border-color:var(--line); }
        #panel-teks .btn-bar { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; min-width:2.5rem; height:2.5rem; padding:0 .75rem; border-radius:.6rem; border:1px solid var(--line); background:var(--bg); color:var(--fg); font-weight:700; font-size:.85rem; transition:all .15s; }
        #panel-teks .btn-bar:hover:not(:disabled) { border-color:var(--aksen); color:var(--aksen); }
        #panel-teks .hidden { display:none !important; }
        #panel-teks .btn-bar:disabled { opacity:.35; cursor:not-allowed; }
        #panel-teks .btn-bar.aktif { background:var(--aksen); border-color:var(--aksen); color:#fff; }
        #panel-teks select, #panel-teks input { background:var(--bg); color:var(--fg); border:1px solid var(--line); }
        #teks-isi { font-family: Georgia, 'Times New Roman', serif; }
        #teks-isi p, #teks-isi h3 { margin-bottom:1.1em; line-height:1.85; border-radius:6px; transition:background .2s, box-shadow .2s; cursor:default; }
        #teks-isi h3 { font-family: ui-sans-serif, system-ui, sans-serif; font-weight:800; font-size:1.2em; line-height:1.4; margin-top:.4em; }
        #teks-isi.bisa-klik p, #teks-isi.bisa-klik h3 { cursor:pointer; }
        #teks-isi .sedang-dibaca { background:var(--hl); box-shadow:0 0 0 6px var(--hl); }
        #teks-isi .teks-meta { font-family: ui-sans-serif, system-ui, sans-serif; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <div id="nav-atas" class="absolute top-4 left-4 right-4 flex justify-between z-[60] pointer-events-none">
        <div class="flex gap-2">
            <button onclick="keluarKeBeranda()" class="pointer-events-auto bg-slate-800/80 backdrop-blur hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-bold shadow-lg transition flex items-center gap-2 text-sm border border-slate-600"><i class="fa-solid fa-arrow-left"></i> Keluar</button>
            <button id="btn-mode-teks" onclick="bukaModeTeks()" class="hidden pointer-events-auto bg-white/90 backdrop-blur hover:bg-white text-slate-800 px-4 py-2 rounded-lg font-bold shadow-lg transition items-center gap-2 text-sm border border-white" title="Baca isi modul sebagai teks & dengarkan dibacakan"><i class="fa-solid fa-align-left text-rose-600"></i> <span>Mode Baca Teks</span></button>
        </div>
        <button id="btn-selesai" onclick="tampilkanKonfirmasiSelesai()" class="hidden pointer-events-auto bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold shadow-lg transition items-center gap-2 text-sm border border-emerald-500"><i class="fa-solid fa-check-double"></i> Selesai Membaca</button>
    </div>

    <div id="wadah-buku" class="w-full h-full flex items-center justify-center absolute inset-0 z-10 transition-opacity duration-500">
        <div class="text-white flex flex-col items-center gap-3"><i class="fa-solid fa-spinner fa-spin text-3xl text-rose-500"></i><p class="font-medium">Menyiapkan modul...</p></div>
    </div>

    <!-- PANEL MODE BACA TEKS -->
    <div id="panel-teks" class="hidden fixed inset-0 z-[70] flex flex-col" role="dialog" aria-label="Mode baca teks">
        <header class="panel-bar shrink-0 border-b px-3 md:px-6 py-2.5 flex flex-wrap items-center gap-2">
            <button onclick="tutupModeTeks()" class="btn-bar" title="Kembali ke tampilan flipbook"><i class="fa-solid fa-book-open"></i><span class="hidden sm:inline">Flipbook</span></button>
            <div class="flex-1 min-w-[8rem] px-1">
                <p class="text-[10px] uppercase tracking-widest font-bold" style="color:var(--muted)">Mode Baca Teks</p>
                <h2 id="teks-judul" class="font-bold truncate text-sm md:text-base"></h2>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="ubahUkuranTeks(-1)" id="btn-font-kecil" class="btn-bar" title="Perkecil teks">A<span class="text-[10px]">−</span></button>
                <button onclick="ubahUkuranTeks(1)" id="btn-font-besar" class="btn-bar" title="Perbesar teks">A<span class="text-[10px]">+</span></button>
                <button onclick="gantiTemaTeks()" id="btn-tema" class="btn-bar" title="Ganti tema baca"><i class="fa-solid fa-circle-half-stroke"></i></button>
            </div>
            <div id="kontrol-tts" class="hidden items-center gap-1.5">
                <button onclick="toggleTTS()" id="btn-tts" class="btn-bar" title="Bacakan halaman ini (klik paragraf untuk mulai dari situ)"><i class="fa-solid fa-volume-high"></i><span class="hidden sm:inline">Bacakan</span></button>
                <button onclick="hentikanTTS()" id="btn-tts-stop" class="btn-bar hidden" title="Hentikan"><i class="fa-solid fa-stop"></i></button>
                <select id="tts-kecepatan" onchange="ubahKecepatanTTS(this.value)" class="h-10 rounded-lg px-2 text-sm font-bold" title="Kecepatan suara">
                    <option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
                </select>
            </div>
        </header>

        <main id="teks-scroll" class="flex-1 overflow-y-auto">
            <article id="teks-isi" class="max-w-2xl mx-auto px-5 md:px-8 py-8 md:py-12"></article>
        </main>

        <footer class="panel-bar shrink-0 border-t px-3 md:px-6 py-2.5 flex items-center justify-between gap-2">
            <button onclick="navHalamanTeks(-1)" id="btn-teks-prev" class="btn-bar"><i class="fa-solid fa-chevron-left"></i><span class="hidden sm:inline">Sebelumnya</span></button>
            <div class="flex items-center gap-2 text-sm font-bold">
                <span style="color:var(--muted)">Hal.</span>
                <input id="input-hal-teks" type="number" min="1" value="1" onchange="lompatHalamanTeks(this.value)" class="w-16 h-10 rounded-lg text-center font-bold" aria-label="Nomor halaman">
                <span style="color:var(--muted)">/ <span id="total-hal-teks">-</span></span>
            </div>
            <button onclick="navHalamanTeks(1)" id="btn-teks-next" class="btn-bar"><span class="hidden sm:inline">Berikutnya</span><i class="fa-solid fa-chevron-right"></i></button>
        </footer>
    </div>

    <div id="wadah-ujian" class="w-full h-full bg-[#f8fafc] flex items-start justify-center p-4 md:p-8 absolute inset-0 z-20 hidden overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-4xl quiz-enter overflow-hidden flex flex-col mt-12 mb-12">
            <div class="bg-indigo-700 text-white px-6 py-4 flex justify-between items-center">
                <h2 class="font-black text-lg" id="header-judul-kuis"><i class="fa-solid fa-pen-clip mr-2"></i> Lembar Evaluasi</h2>
            </div>
            <div class="p-6 md:p-8 flex-1">
                <div id="quiz-content" class="space-y-6">
                    <div class="text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-rose-500 mb-4"></i><p class="text-slate-500">Memuat instrumen...</p></div>
                </div>
            </div>
            <div id="quiz-footer" class="p-6 bg-slate-50 border-t border-slate-200"></div>
        </div>
    </div>

    <div id="modalSelesai" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm modal-enter p-8 text-center relative overflow-hidden">
            <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fa-solid fa-book-open-reader"></i></div>
            <h3 class="text-2xl font-black text-slate-800 mb-2">Modul Selesai!</h3>
            <p id="teks-selesai" class="text-slate-500 text-sm mb-6">Hebat! Kamu telah menyelesaikan materi ini.</p>
            <div class="flex flex-col gap-3">
                <button id="btn-lanjut-kuis" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition hidden">Mulai Evaluasi / Kuis</button>
                <button onclick="keluarKeBeranda()" id="btn-tutup-modul" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl shadow-md transition hidden">Kembali ke Menu Utama</button>
                <button onclick="tutupModalSelesai()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition">Baca Ulang Modul</button>
            </div>
        </div>
    </div>

    <script>
        let supabaseClient; let loggedInUser = null; let dataBuku = null; let bookId = null; 
        let kuisSudahDipicu = false; let adaKuisInternal = false;
        let waktuMulaiMembaca = Date.now(); let waktuMulaiKuis = 0; let currentQuizData = []; let dimGroups = {}; let idKuisAktif = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof CONFIG === 'undefined') return alert("config.js tidak terbaca!");
            supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'dashboard.html';
            loggedInUser = session.user; 
            bookId = new URLSearchParams(window.location.search).get('id');
            if (!bookId) return keluarKeBeranda();

            try {
                const { data: bukuInfo } = await supabaseClient.from('buku').select('*').eq('id', bookId).single();
                if (!bukuInfo) return keluarKeBeranda();
                dataBuku = bukuInfo;

                const { count } = await supabaseClient.from('kuis').select('*', { count: 'exact', head: true }).eq('id_buku', bookId);
                if(count && count > 0) adaKuisInternal = true;

                if (dataBuku.tipe_konten === 'Hanya Kuis' || dataBuku.tipe_konten === 'Evaluasi Global') {
                    document.getElementById('nav-atas').classList.add('hidden');
                    document.getElementById('wadah-buku').classList.add('hidden');
                    return panggilKuisSekarang(bookId, dataBuku.judul);
                }

                // Paksa selalu ambil file PDF terbaru langsung dari database!
let pdfBersih = dataBuku.file_url;

if (!pdfBersih) {
    alert("Modul PDF belum diunggah atau kosong!");
    return keluarKeBeranda();
}
                document.getElementById('wadah-buku').innerHTML = `<div class="_df_book" id="df_container" source="${pdfBersih}"></div>`;
                const btnModeTeks = document.getElementById('btn-mode-teks');
                btnModeTeks.classList.remove('hidden'); btnModeTeks.classList.add('flex');

                window.DFLIP.defaults.onFlip = function(flipbook) {
                    let halSekarang = flipbook.target._activePage || flipbook.target.page; let totalHal = flipbook.target.pageCount || flipbook.options.pageCount;
                    if (halSekarang) halFlipbook = halSekarang;
                    let btnSelesai = document.getElementById('btn-selesai');
                    if (halSekarang && totalHal && halSekarang >= totalHal) {
                        btnSelesai.classList.remove('hidden'); btnSelesai.classList.add('flex');
                        if (!kuisSudahDipicu) { kuisSudahDipicu = true; setTimeout(() => { tampilkanKonfirmasiSelesai(); }, 800); }
                    } else { btnSelesai.classList.add('hidden'); btnSelesai.classList.remove('flex'); kuisSudahDipicu = false; }
                };
                // Tunggu jQuery ready agar DearFlip sudah menyetel lokasi asetnya.
                if(window.DFLIP && window.DFLIP.parseBooks) jQuery(() => window.DFLIP.parseBooks());
            } catch (err) { alert("Gagal memuat modul."); keluarKeBeranda(); }
        });

        function tampilkanKonfirmasiSelesai() { 
            document.getElementById('modalSelesai').classList.remove('hidden'); 
            const btnKuis = document.getElementById('btn-lanjut-kuis');
            
            if (adaKuisInternal) {
                btnKuis.classList.remove('hidden');
                btnKuis.setAttribute('onclick', `transisiKeKuis('${bookId}', '${dataBuku.judul}')`);
            } else if (dataBuku.id_kuis_terkait && dataBuku.id_kuis_terkait.trim() !== '') {
                btnKuis.classList.remove('hidden');
                btnKuis.setAttribute('onclick', `transisiKeKuis('${dataBuku.id_kuis_terkait}', 'Evaluasi Lanjutan')`);
            } else { 
                document.getElementById('btn-tutup-modul').classList.remove('hidden'); 
            }
        }
        
        function tutupModalSelesai() { document.getElementById('modalSelesai').classList.add('hidden'); kuisSudahDipicu = false; }

        async function simpanDurasiBaca() {
            try { await supabaseClient.from('riwayat_kuis').insert([{ id_user: loggedInUser.id, id_buku: bookId, poin_didapat: 0, durasi_baca_detik: Math.floor((Date.now() - waktuMulaiMembaca) / 1000), jenis_tes: "Membaca Modul PDF", dimensi: "Aktivitas" }]); } catch(e) {}
        }

        async function keluarKeBeranda() { document.body.style.cursor = 'wait'; await simpanDurasiBaca(); window.location.href = 'dashboard.html'; }

        async function transisiKeKuis(targetIdKuis, judulTarget) {
            document.getElementById('btn-lanjut-kuis').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyiapkan Evaluasi...';
            await simpanDurasiBaca(); 
            tutupModalSelesai();
            tutupModeTeks();
            
            document.getElementById('nav-atas').classList.add('hidden');
            document.getElementById('wadah-buku').classList.add('opacity-0');
            setTimeout(() => { document.getElementById('wadah-buku').classList.add('hidden'); }, 500);
            panggilKuisSekarang(targetIdKuis, judulTarget);
        }

        async function panggilKuisSekarang(targetId, judulKuis) {
            idKuisAktif = targetId;
            document.getElementById('header-judul-kuis').innerHTML = `<i class="fa-solid fa-pen-clip mr-2"></i> ${judulKuis}`;
            document.getElementById('wadah-ujian').classList.remove('hidden');
            
            try {
                const { data } = await supabaseClient.from('kuis').select('*').eq('id_buku', targetId).order('id', { ascending: true });
                if(!data || data.length === 0) { alert("Tidak ada soal pada modul ini."); return keluarKeBeranda(); }
                
                currentQuizData = data; waktuMulaiKuis = Date.now(); renderSoalKeseluruhan();
            } catch(e) { alert("Gagal mengambil soal."); keluarKeBeranda(); }
        }

        function renderSoalKeseluruhan() {
            const container = document.getElementById('quiz-content'); dimGroups = {};
            currentQuizData.forEach(q => { const dim = q.dimensi || 'Umum'; if(!dimGroups[dim]) dimGroups[dim] = []; dimGroups[dim].push(q); });

            let htmlKuis = `<form id="form-evaluasi" onsubmit="event.preventDefault(); prosesKirimEvaluasi();">`;
            let nomorGlobal = 1;

            Object.keys(dimGroups).forEach((namaDimensi) => {
                htmlKuis += `<div class="mb-8 border-2 border-slate-100 bg-white rounded-2xl shadow-sm overflow-hidden quiz-enter"><div class="bg-indigo-50 px-5 py-4 border-b border-indigo-100 flex items-center gap-3"><i class="fa-solid fa-tags text-indigo-500"></i><h3 class="font-black text-indigo-800 uppercase tracking-wide text-sm md:text-base">Dimensi: ${namaDimensi}</h3></div><div class="p-5 md:p-8 space-y-10">`;
                dimGroups[namaDimensi].forEach(soal => {
                    let htmlOpsi = '';
                    if (soal.opsi_jawaban) {
                        const keys = Object.keys(soal.opsi_jawaban); htmlOpsi = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">`;
                        keys.forEach(k => {
                            const opt = soal.opsi_jawaban[k]; const teks = typeof opt === 'string' ? opt : opt.teks;
                            const poinVal = typeof opt === 'string' ? (k === soal.jawaban_benar ? (soal.poin_reward||1) : 0) : parseInt(opt.poin || 0);
                            htmlOpsi += `<label class="radio-card flex items-start gap-3 p-4 border-2 border-slate-100 rounded-xl cursor-pointer transition hover:bg-slate-50"><input type="radio" name="jawaban_${soal.id}" value="${k}" data-poin="${poinVal}" class="mt-1 w-4 h-4 accent-rose-600 shrink-0" required><span class="text-slate-600 font-medium text-sm leading-snug">${teks}</span></label>`;
                        }); htmlOpsi += `</div>`;
                    }
                    htmlKuis += `<div><p class="font-bold text-slate-800 text-base md:text-lg leading-relaxed"><span class="text-rose-500 mr-2">${nomorGlobal}.</span>${soal.pertanyaan}</p>${htmlOpsi}</div>`;
                    nomorGlobal++;
                }); htmlKuis += `</div></div>`;
            });

            htmlKuis += `</form>`; container.innerHTML = htmlKuis;
            document.getElementById('quiz-footer').innerHTML = `<button type="submit" form="form-evaluasi" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-lg"><i class="fa-solid fa-paper-plane"></i> Kirim Jawaban Evaluasi</button>`;
        }

        async function prosesKirimEvaluasi() {
            const form = document.getElementById('form-evaluasi');
            if(!form.checkValidity()) { form.reportValidity(); return; }
            if(!confirm("Yakin ingin mengirim evaluasi?")) return;

            const btn = document.querySelector('#quiz-footer button'); btn.disabled = true; btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Menyimpan...";

            const formData = new FormData(form); let totalPoinDiDapat = 0; const payloadRiwayat = [];
            const durasiKuisReal = Math.floor((Date.now() - waktuMulaiKuis) / 1000);

            Object.keys(dimGroups).forEach(namaDimensi => {
                let skorDimensi = 0; let rekamanJawaban = {}; 
                dimGroups[namaDimensi].forEach(q => {
                    const jwbUser = formData.get(`jawaban_${q.id}`);
                    if (q.opsi_jawaban && q.opsi_jawaban[jwbUser]) {
                        const opt = q.opsi_jawaban[jwbUser]; skorDimensi += (typeof opt === 'string' ? (jwbUser === q.jawaban_benar ? (q.poin_reward||1) : 0) : parseInt(opt.poin || 0));
                        rekamanJawaban[q.id] = jwbUser; 
                    }
                });
                totalPoinDiDapat += skorDimensi;
                
                payloadRiwayat.push({
                    id_user: loggedInUser.id, id_buku: idKuisAktif, poin_didapat: skorDimensi, durasi_baca_detik: durasiKuisReal,
                    jenis_tes: dataBuku.tipe_konten === 'Evaluasi Global' ? `${dataBuku.judul} - ${namaDimensi}` : dataBuku.judul,
                    dimensi: namaDimensi, detail_jawaban: rekamanJawaban
                });
            });

            try {
                // LOGIKA PRE-TEST: Jika judul mengandung "Pre-Test", jangan beri XP
                const isPreTest = dataBuku.judul.toLowerCase().includes('pre-test') || dataBuku.judul.toLowerCase().includes('pre test');
                const xpYangDitambahkan = isPreTest ? 0 : totalPoinDiDapat;

                if (xpYangDitambahkan > 0) {
                    const { data: profil } = await supabaseClient.from('profiles').select('total_poin').eq('id', loggedInUser.id).single();
                    await supabaseClient.from('profiles').update({ total_poin: (profil.total_poin || 0) + xpYangDitambahkan }).eq('id', loggedInUser.id);
                }
                
                const { error: errRiwayat } = await supabaseClient.from('riwayat_kuis').insert(payloadRiwayat);
                if (errRiwayat) throw errRiwayat;

                document.getElementById('wadah-ujian').classList.add('hidden'); 
                
                // Tampilan Selesai berdasarkan tipe tes
                let uiPoin = isPreTest 
                    ? `<div class="bg-indigo-50 border border-indigo-200 px-6 py-4 rounded-xl mb-6"><span class="text-indigo-700 font-bold text-sm">Terima kasih! Tahap evaluasi awal telah selesai direkam.</span></div>`
                    : `<div class="inline-block bg-rose-50 border border-rose-200 px-8 py-4 rounded-2xl mb-8 shadow-sm"><span class="text-rose-600 font-black text-xl">+ ${xpYangDitambahkan} XP!</span></div>`;

                const htmlSukses = `
                    <div class="w-full h-full bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-6 absolute inset-0 z-50">
                        <div class="text-center py-10 bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full quiz-enter border border-slate-200">
                            <div class="w-24 h-24 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-6"><i class="fa-solid fa-trophy text-rose-500 text-5xl"></i></div>
                            <h3 class="text-2xl font-black text-slate-800 mb-2">Penyelesaian Berhasil!</h3>
                            <p class="text-slate-500 mb-6 text-sm">Respon Anda telah tercatat di dalam sistem.</p>
                            ${uiPoin}
                            <button onclick="window.location.href='dashboard.html'" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md"><i class="fa-solid fa-house mr-2"></i> Kembali ke Menu Utama</button>
                        </div>
                    </div>`;
                    
                document.body.insertAdjacentHTML('beforeend', htmlSukses);
            } catch (err) { alert("Gagal mengirim data: " + err.message); btn.disabled = false; btn.innerHTML = `Coba Kirim Ulang`; }
        }

        // =====================================================
        // MODE BACA TEKS & BACAKAN (TEXT-TO-SPEECH)
        // Mengambil teks dari PDF per halaman (pdf.js), menampilkannya
        // dalam format yang nyaman dibaca, dan bisa dibacakan (Web Speech API).
        // =====================================================
        const UKURAN_TEKS = [15, 17, 19, 22, 26];
        const TEMA_TEKS = ['terang', 'sepia', 'gelap'];
        const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
        const ttsDidukung = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

        let pdfTeks = null; let cacheTeks = {}; let halTeks = 1; let totalHalTeks = 0; let halFlipbook = 1;
        const tts = { aktif: false, jeda: false, antrian: [], idx: 0, sesi: 0, suara: null };
        let prefBaca = muatPrefBaca();

        function escapeHtml(t) { return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        function muatPrefBaca() {
            const bawaan = { ukuran: 1, tema: 'terang', kecepatan: 1 };
            try { return Object.assign(bawaan, JSON.parse(localStorage.getItem('prefBacaTeks') || '{}')); } catch (e) { return bawaan; }
        }
        function simpanPrefBaca() { try { localStorage.setItem('prefBacaTeks', JSON.stringify(prefBaca)); } catch (e) {} }

        function terapkanPrefBaca() {
            const panel = document.getElementById('panel-teks');
            TEMA_TEKS.forEach(t => panel.classList.remove('tema-' + t));
            if (prefBaca.tema !== 'terang') panel.classList.add('tema-' + prefBaca.tema);
            prefBaca.ukuran = Math.min(Math.max(prefBaca.ukuran, 0), UKURAN_TEKS.length - 1);
            document.getElementById('teks-isi').style.fontSize = UKURAN_TEKS[prefBaca.ukuran] + 'px';
            document.getElementById('btn-font-kecil').disabled = prefBaca.ukuran === 0;
            document.getElementById('btn-font-besar').disabled = prefBaca.ukuran === UKURAN_TEKS.length - 1;
            document.getElementById('tts-kecepatan').value = String(prefBaca.kecepatan);
        }
        function ubahUkuranTeks(d) { prefBaca.ukuran += d; terapkanPrefBaca(); simpanPrefBaca(); }
        function gantiTemaTeks() { prefBaca.tema = TEMA_TEKS[(TEMA_TEKS.indexOf(prefBaca.tema) + 1) % TEMA_TEKS.length]; terapkanPrefBaca(); simpanPrefBaca(); }
        function ubahKecepatanTTS(v) { prefBaca.kecepatan = parseFloat(v) || 1; simpanPrefBaca(); }

        // Pakai pdf.js yang sudah dimuat DearFlip bila ada, agar tidak bentrok.
        function muatPdfJs() {
            const siapkan = lib => { if (!lib.GlobalWorkerOptions.workerSrc) lib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${lib.version || '2.16.105'}/pdf.worker.min.js`; return lib; };
            if (window.pdfjsLib) return Promise.resolve(siapkan(window.pdfjsLib));
            return new Promise((resolve, reject) => {
                const el = document.createElement('script');
                el.src = PDFJS_CDN + 'pdf.min.js';
                el.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_CDN + 'pdf.worker.min.js'; resolve(window.pdfjsLib); };
                el.onerror = () => reject(new Error('Gagal memuat pembaca PDF.'));
                document.head.appendChild(el);
            });
        }

        async function bukaModeTeks() {
            const panel = document.getElementById('panel-teks');
            const isi = document.getElementById('teks-isi');
            document.getElementById('teks-judul').textContent = dataBuku ? dataBuku.judul : '';
            if (ttsDidukung) { document.getElementById('kontrol-tts').classList.remove('hidden'); document.getElementById('kontrol-tts').classList.add('flex'); }
            terapkanPrefBaca();
            panel.classList.remove('hidden');

            if (!pdfTeks) {
                isi.innerHTML = `<div class="text-center py-20" style="color:var(--muted)"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3" style="color:var(--aksen)"></i><p class="font-sans font-medium">Menyiapkan teks modul...</p></div>`;
                try {
                    const lib = await muatPdfJs();
                    pdfTeks = await lib.getDocument(dataBuku.file_url).promise;
                    totalHalTeks = pdfTeks.numPages;
                    document.getElementById('total-hal-teks').textContent = totalHalTeks;
                    document.getElementById('input-hal-teks').max = totalHalTeks;
                } catch (err) {
                    console.error(err);
                    isi.innerHTML = `<div class="text-center py-20 font-sans" style="color:var(--muted)"><i class="fa-solid fa-triangle-exclamation text-3xl mb-3 text-amber-500"></i><p class="font-medium">Teks modul tidak dapat dimuat.</p><p class="text-sm mt-1">Silakan gunakan tampilan flipbook.</p></div>`;
                    return;
                }
            }
            tampilkanHalamanTeks(Math.min(Math.max(halFlipbook, 1), totalHalTeks));
        }

        function tutupModeTeks() {
            hentikanTTS();
            document.getElementById('panel-teks').classList.add('hidden');
        }

        async function ambilTeksHalaman(n) {
            if (cacheTeks[n]) return cacheTeks[n];
            const page = await pdfTeks.getPage(n);
            const konten = await page.getTextContent();
            return (cacheTeks[n] = susunParagraf(konten.items));
        }

        // Ubah potongan teks PDF (per posisi) menjadi baris lalu paragraf.
        function susunParagraf(items) {
            const baris = []; let cur = null;
            items.forEach(it => {
                if (typeof it.str !== 'string' || !it.transform) return;
                const x = it.transform[4], y = it.transform[5];
                const h = Math.abs(it.transform[3]) || it.height || 10;
                if (!cur || Math.abs(y - cur.y) > Math.max(h, cur.h) * 0.6) {
                    cur = { teks: '', y, h, xAkhir: x }; baris.push(cur);
                } else if (cur.teks && !/\s$/.test(cur.teks) && !/^\s/.test(it.str) && x - cur.xAkhir > h * 0.2) {
                    cur.teks += ' ';
                }
                cur.teks += it.str;
                cur.h = Math.max(cur.h, h);
                cur.xAkhir = x + (it.width || 0);
            });

            const tinggi = baris.map(b => b.h).sort((a, b) => a - b);
            const median = tinggi.length ? tinggi[Math.floor(tinggi.length / 2)] : 10;

            const paragraf = []; let p = null; let prev = null;
            const tutup = () => { if (p && p.teks) paragraf.push(p); p = null; };
            baris.forEach(b => {
                const t = b.teks.replace(/\s+/g, ' ').trim();
                if (!t) { tutup(); prev = null; return; }
                const judul = b.h > median * 1.25;
                const pisah = !p || !prev
                    || Math.abs(prev.y - b.y) > prev.h * 1.9
                    || Math.abs(b.h - prev.h) > prev.h * 0.25
                    || p.judul !== judul
                    || /^([•▪●◦\-–]|\d{1,2}[.)])\s/.test(t);
                if (pisah) { tutup(); p = { teks: t, judul }; }
                else p.teks = /-$/.test(p.teks) ? p.teks + t : p.teks + ' ' + t;
                prev = b;
            });
            tutup();
            return paragraf;
        }

        async function tampilkanHalamanTeks(n, opsi = {}) {
            n = Math.min(Math.max(parseInt(n) || 1, 1), totalHalTeks);
            halTeks = n;
            document.getElementById('input-hal-teks').value = n;
            document.getElementById('btn-teks-prev').disabled = n <= 1;
            document.getElementById('btn-teks-next').disabled = n >= totalHalTeks;

            const isi = document.getElementById('teks-isi');
            if (!cacheTeks[n]) isi.innerHTML = `<div class="text-center py-20" style="color:var(--muted)"><i class="fa-solid fa-spinner fa-spin text-2xl" style="color:var(--aksen)"></i></div>`;

            let para;
            try { para = await ambilTeksHalaman(n); } catch (e) { console.error(e); para = []; }
            if (n !== halTeks) return; // pengguna sudah pindah halaman

            let html = `<p class="teks-meta">Halaman ${n} dari ${totalHalTeks}</p>`;
            if (!para.length) {
                html += `<div class="text-center py-16 font-sans" style="color:var(--muted)"><i class="fa-regular fa-image text-4xl mb-3"></i><p class="font-medium">Halaman ini berisi gambar atau hasil pindaian, sehingga teksnya tidak dapat ditampilkan.</p><button onclick="tutupModeTeks()" class="btn-bar mt-4 mx-auto"><i class="fa-solid fa-book-open"></i> Lihat di Flipbook</button></div>`;
            } else {
                html += para.map((pr, i) => pr.judul ? `<h3 data-i="${i}">${escapeHtml(pr.teks)}</h3>` : `<p data-i="${i}">${escapeHtml(pr.teks)}</p>`).join('');
            }
            if (n === totalHalTeks) {
                html += `<div class="mt-10 p-6 rounded-2xl text-center font-sans border" style="border-color:var(--line); background:var(--bar)">
                    <i class="fa-solid fa-flag-checkered text-3xl mb-2" style="color:var(--aksen)"></i>
                    <p class="font-bold mb-4">Anda sudah sampai di halaman terakhir.</p>
                    <button onclick="tampilkanKonfirmasiSelesai()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-md transition"><i class="fa-solid fa-check-double mr-2"></i>Selesai Membaca</button>
                </div>`;
            }
            isi.innerHTML = html;
            isi.classList.toggle('bisa-klik', ttsDidukung && para.length > 0);
            if (!opsi.pertahankanScroll) document.getElementById('teks-scroll').scrollTop = 0;

            if (n < totalHalTeks) ambilTeksHalaman(n + 1).catch(() => {}); // prefetch
            if (opsi.lanjutBaca && tts.aktif) mulaiTTS(0);
        }

        function navHalamanTeks(d) { hentikanTTS(); tampilkanHalamanTeks(halTeks + d); }
        function lompatHalamanTeks(v) { hentikanTTS(); tampilkanHalamanTeks(v); }

        // Klik paragraf = mulai dibacakan dari paragraf tersebut.
        document.addEventListener('click', e => {
            const el = e.target.closest('#teks-isi [data-i]');
            if (el && ttsDidukung) mulaiTTS(parseInt(el.dataset.i));
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && !document.getElementById('panel-teks').classList.contains('hidden')) tutupModeTeks();
        });

        // ---------- Text-to-Speech ----------
        function pilihSuaraIndonesia() {
            const daftar = speechSynthesis.getVoices();
            return daftar.find(v => /^id([-_]|$)/i.test(v.lang)) || daftar.find(v => /indonesia/i.test(v.name)) || null;
        }
        if (ttsDidukung) {
            tts.suara = pilihSuaraIndonesia();
            speechSynthesis.addEventListener('voiceschanged', () => { tts.suara = pilihSuaraIndonesia(); });
            window.addEventListener('pagehide', () => speechSynthesis.cancel());
        }

        // Potong teks panjang per kalimat (beberapa browser memutus ucapan yang terlalu panjang).
        function potongKalimat(teks) {
            const kalimat = teks.match(/[^.!?;:]+[.!?;:]*\s*/g) || [teks];
            const hasil = []; let buf = '';
            kalimat.forEach(k => { if (buf && (buf + k).length > 220) { hasil.push(buf.trim()); buf = ''; } buf += k; });
            if (buf.trim()) hasil.push(buf.trim());
            return hasil;
        }

        function mulaiTTS(dariParagraf = 0) {
            if (!ttsDidukung) return;
            const para = cacheTeks[halTeks] || [];
            speechSynthesis.cancel();
            tts.sesi++;
            if (!para.length) {
                if (halTeks < totalHalTeks) { tts.aktif = true; updateTombolTTS(); return tampilkanHalamanTeks(halTeks + 1, { lanjutBaca: true }); }
                return hentikanTTS();
            }
            tts.aktif = true; tts.jeda = false;
            tts.antrian = [];
            para.forEach((pr, i) => { if (i >= dariParagraf) potongKalimat(pr.teks).forEach(k => tts.antrian.push({ i, k })); });
            tts.idx = 0;
            updateTombolTTS();
            ucapkanBerikut(tts.sesi);
        }

        function ucapkanBerikut(sesi) {
            if (!tts.aktif || sesi !== tts.sesi) return;
            if (tts.idx >= tts.antrian.length) {
                tandaiParagraf(null);
                if (halTeks < totalHalTeks) tampilkanHalamanTeks(halTeks + 1, { lanjutBaca: true });
                else hentikanTTS();
                return;
            }
            const { i, k } = tts.antrian[tts.idx];
            tandaiParagraf(i);
            const u = new SpeechSynthesisUtterance(k);
            u.lang = 'id-ID';
            if (tts.suara) u.voice = tts.suara;
            u.rate = prefBaca.kecepatan || 1;
            u.onend = () => { if (sesi !== tts.sesi) return; tts.idx++; ucapkanBerikut(sesi); };
            u.onerror = e => { if (sesi !== tts.sesi || e.error === 'interrupted' || e.error === 'canceled') return; tts.idx++; ucapkanBerikut(sesi); };
            speechSynthesis.speak(u);
        }

        function toggleTTS() {
            if (!tts.aktif) return mulaiTTS(0);
            if (tts.jeda) { speechSynthesis.resume(); tts.jeda = false; }
            else { speechSynthesis.pause(); tts.jeda = true; }
            updateTombolTTS();
        }

        function hentikanTTS() {
            tts.aktif = false; tts.jeda = false; tts.sesi++;
            if (ttsDidukung) speechSynthesis.cancel();
            tandaiParagraf(null);
            updateTombolTTS();
        }

        function tandaiParagraf(i) {
            document.querySelectorAll('#teks-isi .sedang-dibaca').forEach(el => el.classList.remove('sedang-dibaca'));
            if (i === null) return;
            const el = document.querySelector(`#teks-isi [data-i="${i}"]`);
            if (el) { el.classList.add('sedang-dibaca'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        }

        function updateTombolTTS() {
            const btn = document.getElementById('btn-tts');
            const berbicara = tts.aktif && !tts.jeda;
            btn.classList.toggle('aktif', tts.aktif);
            btn.innerHTML = berbicara
                ? '<i class="fa-solid fa-pause"></i><span class="hidden sm:inline">Jeda</span>'
                : `<i class="fa-solid ${tts.aktif ? 'fa-play' : 'fa-volume-high'}"></i><span class="hidden sm:inline">${tts.aktif ? 'Lanjutkan' : 'Bacakan'}</span>`;
            document.getElementById('btn-tts-stop').classList.toggle('hidden', !tts.aktif);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Belajar & Evaluasi - SIRASA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        // Lokasi aset DearFlip (suara balik halaman, library) — tanpa ini dicari di root situs dan 404.
        var dFlipLocation = "https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/";
    </script>
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/themify-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>
    <script>
        // dflip.min.js menimpa DFLIP.defaults saat dimuat, jadi pengaturan harus diterapkan SETELAHNYA.
        Object.assign(DFLIP.defaults, { webgl: true, soundEnable: true, hideControls: "download,print,more,share,fullscreen,toggle,play" });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="dialog.js"></script>
    <link rel="stylesheet" href="slide.css">
    <script src="slide-render.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0f172a; font-family: sans-serif; }
        .modal-enter { animation: fadeIn 0.4s ease-out forwards; }
        .quiz-enter { animation: slideUp 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        ._df_book { height: 100vh !important; width: 100vw !important; margin: 0 !important; }
        input[type="radio"]:checked + span { color: #e11d48; font-weight: bold; }
        .radio-card:has(input[type="radio"]:checked) { border-color: #e11d48; background-color: #fff1f2; }

        /* ===== Mode Baca Teks ===== */
        #panel-teks { --bg:#ffffff; --fg:#1e293b; --muted:#64748b; --bar:#f8fafc; --line:#e2e8f0; --hl:#fef3c7; --aksen:#e11d48; background:var(--bg); color:var(--fg); }
        #panel-teks.tema-sepia { --bg:#f7f0e1; --fg:#3f301d; --muted:#86725a; --bar:#efe5cf; --line:#dccfb2; --hl:#f1dca0; --aksen:#b45309; }
        #panel-teks.tema-gelap { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --bar:#1e293b; --line:#334155; --hl:#3b3517; --aksen:#fb7185; }
        #panel-teks .panel-bar { background:var(--bar); border-color:var(--line); }
        #panel-teks .btn-bar { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; min-width:2.5rem; height:2.5rem; padding:0 .75rem; border-radius:.6rem; border:1px solid var(--line); background:var(--bg); color:var(--fg); font-weight:700; font-size:.85rem; transition:all .15s; }
        #panel-teks .btn-bar:hover:not(:disabled) { border-color:var(--aksen); color:var(--aksen); }
        #panel-teks .hidden { display:none !important; }
        #panel-teks .btn-bar:disabled { opacity:.35; cursor:not-allowed; }
        #panel-teks .btn-bar.aktif { background:var(--aksen); border-color:var(--aksen); color:#fff; }
        #panel-teks select, #panel-teks input { background:var(--bg); color:var(--fg); border:1px solid var(--line); }
        #teks-isi { font-family: Georgia, 'Times New Roman', serif; }
        #teks-isi p, #teks-isi h3 { margin-bottom:1.1em; line-height:1.85; border-radius:6px; transition:background .2s, box-shadow .2s; cursor:default; }
        #teks-isi h3 { font-family: ui-sans-serif, system-ui, sans-serif; font-weight:800; font-size:1.2em; line-height:1.4; margin-top:.4em; }
        #teks-isi.bisa-klik p, #teks-isi.bisa-klik h3 { cursor:pointer; }
        #teks-isi .sedang-dibaca { background:var(--hl); box-shadow:0 0 0 6px var(--hl); }
        #teks-isi .teks-meta { font-family: ui-sans-serif, system-ui, sans-serif; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <div id="nav-atas" class="absolute top-4 left-4 right-4 flex justify-between z-[60] pointer-events-none">
        <div class="flex gap-2">
            <button onclick="keluarKeBeranda()" class="pointer-events-auto bg-slate-800/80 backdrop-blur hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-bold shadow-lg transition flex items-center gap-2 text-sm border border-slate-600"><i class="fa-solid fa-arrow-left"></i> Keluar</button>
            <button id="btn-mode-teks" onclick="bukaModeTeks()" class="hidden pointer-events-auto bg-white/90 backdrop-blur hover:bg-white text-slate-800 px-4 py-2 rounded-lg font-bold shadow-lg transition items-center gap-2 text-sm border border-white" title="Baca isi modul sebagai teks & dengarkan dibacakan"><i class="fa-solid fa-align-left text-rose-600"></i> <span>Mode Baca Teks</span></button>
        </div>
        <button id="btn-selesai" onclick="tampilkanKonfirmasiSelesai()" class="hidden pointer-events-auto bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold shadow-lg transition items-center gap-2 text-sm border border-emerald-500"><i class="fa-solid fa-check-double"></i> Selesai Membaca</button>
    </div>

    <div id="wadah-buku" class="w-full h-full flex items-center justify-center absolute inset-0 z-10 transition-opacity duration-500">
        <div class="text-white flex flex-col items-center gap-3"><i class="fa-solid fa-spinner fa-spin text-3xl text-rose-500"></i><p class="font-medium">Menyiapkan modul...</p></div>
    </div>

    <!-- PEMBACA MODUL SLIDE -->
    <div id="wadah-slide" class="hidden fixed inset-0 z-10 flex flex-col bg-[#0b1d3a] select-none">
        <div class="h-1 bg-white/10 shrink-0"><div id="sl-progres" class="h-full bg-rose-500 transition-all duration-300" style="width:0%"></div></div>
        <div class="flex-1 min-h-0 flex items-center justify-center px-2 pt-16 pb-2 md:px-6 md:pt-20 md:pb-3">
            <div id="sl-bingkai" class="w-full h-full max-w-[1280px] rounded-2xl overflow-hidden shadow-2xl bg-white">
                <div id="sl-panggung" class="w-full h-full"></div>
            </div>
        </div>
        <div class="shrink-0 px-3 md:px-6 pt-1 pb-3 flex items-center justify-between gap-2 text-white" style="padding-bottom: max(env(safe-area-inset-bottom), 12px)">
            <button onclick="geserSlide(-1)" id="sl-prev" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-lg disabled:opacity-30" aria-label="Slide sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="flex items-center gap-3 md:gap-5">
                <label class="flex items-center gap-2 text-[11px] md:text-xs font-bold text-white/70 cursor-pointer" title="Pindah slide otomatis setelah narasi selesai">
                    <input type="checkbox" id="sl-otomatis" checked class="accent-rose-500 w-4 h-4"> <span>Lanjut otomatis</span>
                </label>
                <button onclick="toggleNarasi()" id="sl-play" class="w-14 h-14 rounded-full bg-rose-600 hover:bg-rose-500 shadow-lg shadow-rose-900/40 flex items-center justify-center text-xl" aria-label="Putar narasi"><i class="fa-solid fa-play ml-0.5"></i></button>
                <span id="sl-hitung" class="text-sm font-bold text-white/80 tabular-nums w-14 text-center">1 / 1</span>
            </div>
            <button onclick="geserSlide(1)" id="sl-next" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-lg" aria-label="Slide berikutnya"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <!-- PANEL MODE BACA TEKS -->
    <div id="panel-teks" class="hidden fixed inset-0 z-[70] flex flex-col" role="dialog" aria-label="Mode baca teks">
        <header class="panel-bar shrink-0 border-b px-3 md:px-6 py-2.5 flex flex-wrap items-center gap-2">
            <button onclick="tutupModeTeks()" class="btn-bar" title="Kembali ke tampilan flipbook"><i class="fa-solid fa-book-open"></i><span class="hidden sm:inline">Flipbook</span></button>
            <div class="flex-1 min-w-[8rem] px-1">
                <p class="text-[10px] uppercase tracking-widest font-bold" style="color:var(--muted)">Mode Baca Teks</p>
                <h2 id="teks-judul" class="font-bold truncate text-sm md:text-base"></h2>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="ubahUkuranTeks(-1)" id="btn-font-kecil" class="btn-bar" title="Perkecil teks">A<span class="text-[10px]">−</span></button>
                <button onclick="ubahUkuranTeks(1)" id="btn-font-besar" class="btn-bar" title="Perbesar teks">A<span class="text-[10px]">+</span></button>
                <button onclick="gantiTemaTeks()" id="btn-tema" class="btn-bar" title="Ganti tema baca"><i class="fa-solid fa-circle-half-stroke"></i></button>
            </div>
            <div id="kontrol-tts" class="hidden items-center gap-1.5">
                <button onclick="toggleTTS()" id="btn-tts" class="btn-bar" title="Bacakan halaman ini (klik paragraf untuk mulai dari situ)"><i class="fa-solid fa-volume-high"></i><span class="hidden sm:inline">Bacakan</span></button>
                <button onclick="hentikanTTS()" id="btn-tts-stop" class="btn-bar hidden" title="Hentikan"><i class="fa-solid fa-stop"></i></button>
                <select id="tts-suara" onchange="ubahSuaraTTS(this.value)" class="hidden sm:block h-10 max-w-[11rem] rounded-lg px-2 text-sm font-bold" title="Pilih suara pembaca"></select>
                <select id="tts-kecepatan" onchange="ubahKecepatanTTS(this.value)" class="h-10 rounded-lg px-2 text-sm font-bold" title="Kecepatan suara">
                    <option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
                </select>
            </div>
        </header>

        <main id="teks-scroll" class="flex-1 overflow-y-auto">
            <article id="teks-isi" class="max-w-2xl mx-auto px-5 md:px-8 py-8 md:py-12"></article>
        </main>

        <footer class="panel-bar shrink-0 border-t px-3 md:px-6 py-2.5 flex items-center justify-between gap-2">
            <button onclick="navHalamanTeks(-1)" id="btn-teks-prev" class="btn-bar"><i class="fa-solid fa-chevron-left"></i><span class="hidden sm:inline">Sebelumnya</span></button>
            <div class="flex items-center gap-2 text-sm font-bold">
                <span style="color:var(--muted)">Hal.</span>
                <input id="input-hal-teks" type="number" min="1" value="1" onchange="lompatHalamanTeks(this.value)" class="w-16 h-10 rounded-lg text-center font-bold" aria-label="Nomor halaman">
                <span style="color:var(--muted)">/ <span id="total-hal-teks">-</span></span>
            </div>
            <button onclick="navHalamanTeks(1)" id="btn-teks-next" class="btn-bar"><span class="hidden sm:inline">Berikutnya</span><i class="fa-solid fa-chevron-right"></i></button>
        </footer>
    </div>

    <div id="wadah-ujian" class="hidden fixed inset-0 z-20 bg-[#f4f7fb] overflow-y-auto flex flex-col">
        <!-- Kepala kuis -->
        <header class="sticky top-0 z-10 bg-white/95 backdrop-blur border-b border-slate-200" style="padding-top: env(safe-area-inset-top)">
            <div class="max-w-5xl mx-auto px-4 md:px-6 py-3 flex items-center gap-3">
                <button onclick="keluarDariKuis()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center shrink-0" aria-label="Keluar dari kuis"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="min-w-0 flex-1">
                    <h2 id="header-judul-kuis" class="font-black text-slate-800 truncate text-[15px] md:text-lg">Lembar Evaluasi</h2>
                    <p id="kuis-subjudul" class="text-[11px] md:text-xs font-semibold text-slate-400 truncate">Memuat soal...</p>
                </div>
                <span id="kuis-terjawab" class="shrink-0 text-[11px] md:text-xs font-black text-[#1769b3] bg-[#e8f1fb] px-3 py-1.5 rounded-full">0/0 terjawab</span>
            </div>
            <div class="h-1.5 bg-slate-100"><div id="kuis-progres" class="h-full bg-gradient-to-r from-[#1769b3] to-[#1f86d6] transition-all duration-300" style="width:0%"></div></div>
        </header>

        <div class="flex-1 w-full max-w-5xl mx-auto px-4 md:px-6 py-5 md:py-8 grid grid-cols-1 lg:grid-cols-[1fr_300px] gap-5 items-start content-start">
            <!-- Kartu soal -->
            <section id="kuis-kartu" class="bg-white rounded-3xl shadow-sm border border-slate-100 p-5 md:p-8 quiz-enter">
                <div class="text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-[#1769b3] mb-4"></i><p class="text-slate-500">Memuat instrumen...</p></div>
            </section>

            <!-- Navigasi soal -->
            <aside class="bg-white rounded-3xl shadow-sm border border-slate-100 p-5 lg:sticky lg:top-24">
                <button onclick="toggleNavSoal()" class="w-full flex items-center justify-between lg:cursor-default" aria-controls="kuis-nav">
                    <h3 class="font-black text-slate-800 text-sm">Navigasi Soal</h3>
                    <i id="kuis-nav-ikon" class="fa-solid fa-chevron-down text-slate-400 lg:hidden transition-transform"></i>
                </button>
                <div id="kuis-nav-wadah" class="hidden lg:block">
                    <div id="kuis-nav" class="grid grid-cols-5 gap-2 mt-4"></div>
                    <div class="flex flex-wrap gap-x-4 gap-y-1.5 mt-4 text-[11px] font-semibold text-slate-500">
                        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-100 border border-emerald-300"></span>Terjawab</span>
                        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-[#1769b3]"></span>Aktif</span>
                        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-100 border border-slate-200"></span>Belum</span>
                    </div>
                </div>
                <button onclick="kirimKuis()" id="kuis-btn-kirim-samping" class="hidden lg:flex w-full mt-5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl items-center justify-center gap-2 text-sm"><i class="fa-solid fa-paper-plane"></i> Kirim Jawaban</button>
            </aside>
        </div>

        <!-- Tombol sebelumnya / berikutnya -->
        <footer class="sticky bottom-0 bg-white/95 backdrop-blur border-t border-slate-200" style="padding-bottom: env(safe-area-inset-bottom)">
            <div class="max-w-5xl mx-auto px-4 md:px-6 py-3 flex gap-3">
                <button onclick="pindahSoal(-1)" id="kuis-prev" class="flex-1 md:flex-none md:w-44 py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold disabled:opacity-40 flex items-center justify-center gap-2"><i class="fa-solid fa-arrow-left"></i> Sebelumnya</button>
                <button onclick="pindahSoal(1)" id="kuis-next" class="flex-1 md:flex-none md:w-52 md:ml-auto py-3.5 rounded-2xl bg-[#1769b3] hover:bg-[#135a9a] text-white font-bold flex items-center justify-center gap-2">Berikutnya <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </footer>
    </div>

    <div id="modalSelesai" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm modal-enter p-8 text-center relative overflow-hidden">
            <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fa-solid fa-book-open-reader"></i></div>
            <h3 class="text-2xl font-black text-slate-800 mb-2">Modul Selesai!</h3>
            <p id="teks-selesai" class="text-slate-500 text-sm mb-6">Hebat! Kamu telah menyelesaikan materi ini.</p>
            <div class="flex flex-col gap-3">
                <button id="btn-lanjut-kuis" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition hidden">Mulai Evaluasi / Kuis</button>
                <button onclick="keluarKeBeranda()" id="btn-tutup-modul" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl shadow-md transition hidden">Kembali ke Menu Utama</button>
                <button onclick="tutupModalSelesai()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition">Baca Ulang Modul</button>
            </div>
        </div>
    </div>

    <script>
        let supabaseClient; let loggedInUser = null; let dataBuku = null; let bookId = null; let bukuKuis = null; 
        let kuisSudahDipicu = false; let adaKuisInternal = false;
        let waktuMulaiMembaca = Date.now(); let waktuMulaiKuis = 0; let currentQuizData = []; let dimGroups = {}; let idKuisAktif = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof CONFIG === 'undefined') return Dialog.alert("config.js tidak terbaca!");
            supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'dashboard.html';
            loggedInUser = session.user; 
            bookId = new URLSearchParams(window.location.search).get('id');
            if (!bookId) return keluarKeBeranda();

            try {
                const { data: bukuInfo } = await supabaseClient.from('buku').select('*').eq('id', bookId).single();
                if (!bukuInfo) return keluarKeBeranda();
                dataBuku = bukuInfo;

                const { count } = await supabaseClient.from('kuis').select('*', { count: 'exact', head: true }).eq('id_buku', bookId);
                if(count && count > 0) adaKuisInternal = true;

                if (dataBuku.tipe_konten === 'Hanya Kuis' || dataBuku.tipe_konten === 'Evaluasi Global') {
                    document.getElementById('nav-atas').classList.add('hidden');
                    document.getElementById('wadah-buku').classList.add('hidden');
                    return panggilKuisSekarang(bookId, dataBuku.judul);
                }

                if (dataBuku.tipe_konten === 'Modul Slide') return mulaiModeSlide();

                // Paksa selalu ambil file PDF terbaru langsung dari database!
let pdfBersih = dataBuku.file_url;

if (!pdfBersih) {
    await Dialog.alert("Modul PDF belum diunggah atau kosong!");
    return keluarKeBeranda();
}
                document.getElementById('wadah-buku').innerHTML = `<div class="_df_book" id="df_container" source="${pdfBersih}"></div>`;
                const btnModeTeks = document.getElementById('btn-mode-teks');
                btnModeTeks.classList.remove('hidden'); btnModeTeks.classList.add('flex');

                window.DFLIP.defaults.onFlip = function(flipbook) {
                    let halSekarang = flipbook.target._activePage || flipbook.target.page; let totalHal = flipbook.target.pageCount || flipbook.options.pageCount;
                    if (halSekarang) halFlipbook = halSekarang;
                    let btnSelesai = document.getElementById('btn-selesai');
                    if (halSekarang && totalHal && halSekarang >= totalHal) {
                        btnSelesai.classList.remove('hidden'); btnSelesai.classList.add('flex');
                        if (!kuisSudahDipicu) { kuisSudahDipicu = true; setTimeout(() => { tampilkanKonfirmasiSelesai(); }, 800); }
                    } else { btnSelesai.classList.add('hidden'); btnSelesai.classList.remove('flex'); kuisSudahDipicu = false; }
                };
                // Tunggu jQuery ready agar DearFlip sudah menyetel lokasi asetnya.
                if(window.DFLIP && window.DFLIP.parseBooks) jQuery(() => window.DFLIP.parseBooks());
            } catch (err) { await Dialog.alert("Gagal memuat modul."); keluarKeBeranda(); }
        });

        function tampilkanKonfirmasiSelesai() { 
            document.getElementById('modalSelesai').classList.remove('hidden'); 
            const btnKuis = document.getElementById('btn-lanjut-kuis');
            
            if (adaKuisInternal) {
                btnKuis.classList.remove('hidden');
                btnKuis.setAttribute('onclick', `transisiKeKuis('${bookId}', '${dataBuku.judul}')`);
            } else if (dataBuku.id_kuis_terkait && dataBuku.id_kuis_terkait.trim() !== '') {
                btnKuis.classList.remove('hidden');
                btnKuis.setAttribute('onclick', `transisiKeKuis('${dataBuku.id_kuis_terkait}', 'Evaluasi Lanjutan')`);
            } else { 
                document.getElementById('btn-tutup-modul').classList.remove('hidden'); 
            }
        }
        
        function tutupModalSelesai() { document.getElementById('modalSelesai').classList.add('hidden'); kuisSudahDipicu = false; }

        let durasiSudahDisimpan = false;
        async function simpanDurasiBaca() {
            // Hanya modul bacaan (PDF/Slide) yang dicatat durasi bacanya, dan cukup sekali per kunjungan
            if (durasiSudahDisimpan || !dataBuku || !['Modul PDF', 'Modul Slide'].includes(dataBuku.tipe_konten)) return;
            durasiSudahDisimpan = true;
            try { await supabaseClient.from('riwayat_kuis').insert([{ id_user: loggedInUser.id, id_buku: bookId, poin_didapat: 0, durasi_baca_detik: Math.floor((Date.now() - waktuMulaiMembaca) / 1000), jenis_tes: dataBuku && dataBuku.tipe_konten === 'Modul Slide' ? "Membaca Modul Slide" : "Membaca Modul PDF", dimensi: "Aktivitas" }]); } catch(e) {}
        }

        async function keluarKeBeranda() { document.body.style.cursor = 'wait'; hentikanNarasi(); await simpanDurasiBaca(); window.location.href = 'dashboard.html'; }

        async function transisiKeKuis(targetIdKuis, judulTarget) {
            document.getElementById('btn-lanjut-kuis').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyiapkan Evaluasi...';
            await simpanDurasiBaca(); 
            tutupModalSelesai();
            tutupModeTeks();
            hentikanNarasi();
            document.getElementById('wadah-slide').classList.add('hidden');
            
            document.getElementById('nav-atas').classList.add('hidden');
            document.getElementById('wadah-buku').classList.add('opacity-0');
            setTimeout(() => { document.getElementById('wadah-buku').classList.add('hidden'); }, 500);
            panggilKuisSekarang(targetIdKuis, judulTarget);
        }

        async function panggilKuisSekarang(targetId, judulKuis) {
            idKuisAktif = targetId;
            document.getElementById('header-judul-kuis').textContent = judulKuis;
            document.getElementById('wadah-ujian').classList.remove('hidden');

            try {
                // Info wadah kuis (bisa berbeda dari modul bacaan bila kuis ditautkan)
                const [{ data: infoKuis }, { data }] = await Promise.all([
                    supabaseClient.from('buku').select('id, judul, tipe_konten').eq('id', targetId).maybeSingle(),
                    supabaseClient.from('kuis').select('*').eq('id_buku', targetId).order('id', { ascending: true })
                ]);
                if(!data || data.length === 0) { await Dialog.alert("Tidak ada soal pada modul ini."); return keluarKeBeranda(); }
                bukuKuis = infoKuis || { id: targetId, judul: judulKuis, tipe_konten: dataBuku.tipe_konten };
                if (infoKuis) document.getElementById('header-judul-kuis').textContent = infoKuis.judul;

                currentQuizData = data; waktuMulaiKuis = Date.now();
                siapkanKuis();
            } catch(e) { console.error(e); await Dialog.alert("Gagal mengambil soal."); keluarKeBeranda(); }
        }

        // ================= KUIS PER SOAL DENGAN NAVIGASI =================
        const kuis = { urutan: [], jawaban: {}, idx: 0, terkirim: false };
        const HURUF = ['A', 'B', 'C', 'D', 'E', 'F'];
        const kunciSimpanKuis = () => `jawabanKuis:${loggedInUser.id}:${idKuisAktif}`;

        function siapkanKuis() {
            // Kelompokkan per dimensi (urutan soal = urutan dimensi seperti sebelumnya)
            dimGroups = {};
            currentQuizData.forEach(q => { const dim = q.dimensi || 'Umum'; (dimGroups[dim] = dimGroups[dim] || []).push(q); });
            kuis.urutan = Object.values(dimGroups).flat();
            kuis.idx = 0;
            try { kuis.jawaban = JSON.parse(sessionStorage.getItem(kunciSimpanKuis()) || '{}'); } catch (e) { kuis.jawaban = {}; }
            // Mulai dari soal pertama yang belum dijawab (jika melanjutkan)
            const belum = kuis.urutan.findIndex(q => !kuis.jawaban[q.id]);
            if (belum > 0) kuis.idx = belum;
            tampilSoal();
        }

        function opsiSoal(q) {
            return Object.keys(q.opsi_jawaban || {}).map(k => {
                const opt = q.opsi_jawaban[k];
                return { kunci: k, teks: typeof opt === 'string' ? opt : opt.teks };
            });
        }

        function tampilSoal() {
            const total = kuis.urutan.length, q = kuis.urutan[kuis.idx];
            const dimensiBanyak = Object.keys(dimGroups).length > 1 || (q.dimensi && q.dimensi !== 'Umum');
            document.getElementById('kuis-subjudul').textContent = `Soal ${kuis.idx + 1} dari ${total}` + (dimensiBanyak ? ` · ${q.dimensi || 'Umum'}` : '');

            const pilihan = kuis.jawaban[q.id];
            document.getElementById('kuis-kartu').innerHTML = `
                <div class="flex items-center justify-between gap-3 mb-4">
                    <span class="text-xs font-black uppercase tracking-widest text-[#1769b3] bg-[#e8f1fb] px-3 py-1.5 rounded-full">Soal ${kuis.idx + 1}</span>
                    ${dimensiBanyak ? `<span class="text-[11px] font-bold text-slate-400 truncate">${escapeHtml(q.dimensi || 'Umum')}</span>` : ''}
                </div>
                <p class="font-bold text-slate-800 text-lg md:text-xl leading-relaxed mb-6">${escapeHtml(q.pertanyaan)}</p>
                <div class="space-y-3" role="radiogroup">
                    ${opsiSoal(q).map((o, i) => {
                        const aktif = pilihan === o.kunci;
                        return `<button type="button" role="radio" aria-checked="${aktif}" onclick="pilihJawaban('${q.id}', '${o.kunci}')"
                            class="w-full text-left flex items-center gap-4 p-4 rounded-2xl border-2 transition ${aktif ? 'border-[#1769b3] bg-[#e8f1fb]' : 'border-slate-100 hover:border-slate-200 hover:bg-slate-50'}">
                            <span class="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center font-black text-sm ${aktif ? 'bg-[#1769b3] text-white' : 'bg-slate-100 text-slate-500'}">${HURUF[i] || o.kunci}</span>
                            <span class="font-semibold ${aktif ? 'text-[#0b1d3a]' : 'text-slate-600'} leading-snug">${escapeHtml(o.teks)}</span>
                            ${aktif ? '<i class="fa-solid fa-circle-check text-[#1769b3] ml-auto text-lg"></i>' : ''}
                        </button>`;
                    }).join('')}
                </div>`;

            document.getElementById('kuis-prev').disabled = kuis.idx === 0;
            const terakhir = kuis.idx === total - 1, btnNext = document.getElementById('kuis-next');
            btnNext.innerHTML = terakhir ? '<i class="fa-solid fa-paper-plane"></i> Kirim Jawaban' : 'Berikutnya <i class="fa-solid fa-arrow-right"></i>';
            btnNext.classList.toggle('!bg-emerald-600', terakhir);
            perbaruiNavSoal();
            document.getElementById('wadah-ujian').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function perbaruiNavSoal() {
            const total = kuis.urutan.length, terjawab = kuis.urutan.filter(q => kuis.jawaban[q.id]).length;
            document.getElementById('kuis-terjawab').textContent = `${terjawab}/${total} terjawab`;
            document.getElementById('kuis-progres').style.width = (total ? terjawab / total * 100 : 0) + '%';
            document.getElementById('kuis-nav').innerHTML = kuis.urutan.map((q, i) => {
                const gaya = i === kuis.idx ? 'bg-[#1769b3] text-white border-[#1769b3] shadow-md'
                    : kuis.jawaban[q.id] ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-slate-50 text-slate-500 border-slate-200';
                return `<button type="button" onclick="lompatSoal(${i})" class="aspect-square rounded-xl border text-sm font-black transition hover:scale-105 ${gaya}" aria-label="Soal ${i + 1}">${i + 1}</button>`;
            }).join('');
        }

        function pilihJawaban(idSoal, kunci) {
            kuis.jawaban[idSoal] = kunci;
            try { sessionStorage.setItem(kunciSimpanKuis(), JSON.stringify(kuis.jawaban)); } catch (e) {}
            tampilSoal();
        }
        function lompatSoal(i) { kuis.idx = i; tampilSoal(); if (window.innerWidth < 1024) toggleNavSoal(false); }
        function pindahSoal(arah) {
            if (arah > 0 && kuis.idx === kuis.urutan.length - 1) return kirimKuis();
            kuis.idx = Math.max(0, Math.min(kuis.urutan.length - 1, kuis.idx + arah));
            tampilSoal();
        }
        function toggleNavSoal(paksa) {
            const w = document.getElementById('kuis-nav-wadah');
            const buka = typeof paksa === 'boolean' ? paksa : w.classList.contains('hidden');
            w.classList.toggle('hidden', !buka);
            document.getElementById('kuis-nav-ikon').classList.toggle('rotate-180', buka);
        }

        async function keluarDariKuis() {
            const adaJawaban = Object.keys(kuis.jawaban).length > 0;
            const ok = await Dialog.confirm(adaJawaban
                ? 'Jawabanmu belum dikirim. Jawaban yang sudah dipilih tetap tersimpan sementara di perangkat ini, jadi kamu bisa melanjutkannya nanti.'
                : 'Keluar dari kuis dan kembali ke menu utama?', { judul: 'Keluar dari Kuis?', teksOk: 'Keluar', tipe: 'peringatan' });
            if (ok) keluarKeBeranda();
        }

        document.addEventListener('keydown', e => {
            if (document.getElementById('wadah-ujian').classList.contains('hidden') || kuis.terkirim || document.querySelector('.sd-latar')) return;
            if (e.key === 'ArrowRight') { e.preventDefault(); pindahSoal(1); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); pindahSoal(-1); }
            else if (/^[1-6]$/.test(e.key) || /^[a-fA-F]$/.test(e.key)) {
                const q = kuis.urutan[kuis.idx], o = opsiSoal(q)[/^\d$/.test(e.key) ? +e.key - 1 : HURUF.indexOf(e.key.toUpperCase())];
                if (o) pilihJawaban(q.id, o.kunci);
            }
        });

        async function kirimKuis() {
            if (kuis.terkirim) return;
            const belum = kuis.urutan.map((q, i) => kuis.jawaban[q.id] ? null : i + 1).filter(Boolean);
            if (belum.length) {
                await Dialog.alert(`Masih ada ${belum.length} soal yang belum dijawab: nomor ${belum.slice(0, 12).join(', ')}${belum.length > 12 ? ', ...' : ''}.`, { judul: 'Belum Lengkap', tipe: 'peringatan', teksOk: 'Ke Soal ' + belum[0] });
                return lompatSoal(belum[0] - 1);
            }
            if (!(await Dialog.confirm('Setelah dikirim, jawaban tidak bisa diubah lagi.', { judul: 'Kirim Jawaban?', teksOk: 'Kirim Sekarang', teksBatal: 'Periksa Lagi', tipe: 'info' }))) return;
            prosesKirimEvaluasi();
        }

        async function prosesKirimEvaluasi() {
            const btn = document.getElementById('kuis-next'), btnSamping = document.getElementById('kuis-btn-kirim-samping');
            [btn, btnSamping].forEach(b => { b.disabled = true; });
            btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Menyimpan...";
            kuis.terkirim = true;

            const info = bukuKuis || dataBuku;
            let totalPoinDiDapat = 0; const payloadRiwayat = [];
            const durasiKuisReal = Math.floor((Date.now() - waktuMulaiKuis) / 1000);

            Object.keys(dimGroups).forEach(namaDimensi => {
                let skorDimensi = 0; const rekamanJawaban = {};
                dimGroups[namaDimensi].forEach(q => {
                    const jwbUser = kuis.jawaban[q.id];
                    if (q.opsi_jawaban && q.opsi_jawaban[jwbUser]) {
                        const opt = q.opsi_jawaban[jwbUser];
                        skorDimensi += (typeof opt === 'string' ? (jwbUser === q.jawaban_benar ? (q.poin_reward||1) : 0) : parseInt(opt.poin || 0));
                        rekamanJawaban[q.id] = jwbUser;
                    }
                });
                totalPoinDiDapat += skorDimensi;
                payloadRiwayat.push({
                    id_user: loggedInUser.id, id_buku: idKuisAktif, poin_didapat: skorDimensi, durasi_baca_detik: durasiKuisReal,
                    jenis_tes: info.tipe_konten === 'Evaluasi Global' ? `${info.judul} - ${namaDimensi}` : info.judul,
                    dimensi: namaDimensi, detail_jawaban: rekamanJawaban
                });
            });

            try {
                // Pre-Test tidak memberi XP
                const isPreTest = /pre[- ]?test/i.test(info.judul || '');
                const xpYangDitambahkan = isPreTest ? 0 : totalPoinDiDapat;

                // 1) Simpan riwayat DULU. XP hanya ditambahkan jika riwayat berhasil tersimpan,
                //    agar tidak ada XP "yatim" tanpa catatan jawaban.
                const { error: errRiwayat } = await supabaseClient.from('riwayat_kuis').insert(payloadRiwayat);
                if (errRiwayat) throw errRiwayat;

                // 2) Tambah XP
                if (xpYangDitambahkan > 0) {
                    const { data: profil } = await supabaseClient.from('profiles').select('total_poin').eq('id', loggedInUser.id).single();
                    await supabaseClient.from('profiles').update({ total_poin: ((profil && profil.total_poin) || 0) + xpYangDitambahkan }).eq('id', loggedInUser.id);
                }
                try { sessionStorage.removeItem(kunciSimpanKuis()); } catch (e) {}

                document.getElementById('wadah-ujian').classList.add('hidden');
                const uiPoin = isPreTest
                    ? `<div class="bg-[#e8f1fb] border border-[#1769b3]/20 px-6 py-4 rounded-xl mb-6"><span class="text-[#1769b3] font-bold text-sm">Terima kasih! Tahap evaluasi awal telah selesai direkam.</span></div>`
                    : `<div class="inline-block bg-amber-50 border border-amber-200 px-8 py-4 rounded-2xl mb-8 shadow-sm"><span class="text-amber-600 font-black text-xl"><i class="fa-solid fa-star mr-1"></i> + ${xpYangDitambahkan} XP!</span></div>`;
                document.body.insertAdjacentHTML('beforeend', `
                    <div class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-6">
                        <div class="text-center bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full quiz-enter">
                            <div class="w-24 h-24 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6"><i class="fa-solid fa-trophy text-emerald-500 text-5xl"></i></div>
                            <h3 class="text-2xl font-black text-slate-800 mb-2">Jawaban Terkirim!</h3>
                            <p class="text-slate-500 mb-6 text-sm">Semua ${kuis.urutan.length} jawabanmu sudah tercatat.</p>
                            ${uiPoin}
                            <button onclick="window.location.href='dashboard.html'" class="w-full bg-[#1769b3] hover:bg-[#135a9a] text-white font-bold py-3.5 rounded-xl transition shadow-md"><i class="fa-solid fa-house mr-2"></i> Kembali ke Menu Utama</button>
                        </div>
                    </div>`);
            } catch (err) {
                kuis.terkirim = false;
                [btn, btnSamping].forEach(b => { b.disabled = false; });
                tampilSoal();
                Dialog.alert("Gagal mengirim jawaban: " + err.message + "\n\nJawabanmu masih tersimpan, silakan coba kirim lagi.");
            }
        }

        // =====================================================
        // MODE BACA TEKS & BACAKAN (TEXT-TO-SPEECH)
        // Mengambil teks dari PDF per halaman (pdf.js), menampilkannya
        // dalam format yang nyaman dibaca, dan bisa dibacakan (Web Speech API).
        // =====================================================
        const UKURAN_TEKS = [15, 17, 19, 22, 26];
        const TEMA_TEKS = ['terang', 'sepia', 'gelap'];
        const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
        const ttsDidukung = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

        let pdfTeks = null; let cacheTeks = {}; let halTeks = 1; let totalHalTeks = 0; let halFlipbook = 1;
        const tts = { aktif: false, jeda: false, antrian: [], idx: 0, sesi: 0, suara: null };
        let prefBaca = muatPrefBaca();

        function escapeHtml(t) { return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        function muatPrefBaca() {
            const bawaan = { ukuran: 1, tema: 'terang', kecepatan: 1, suara: '' };
            try { return Object.assign(bawaan, JSON.parse(localStorage.getItem('prefBacaTeks') || '{}')); } catch (e) { return bawaan; }
        }
        function simpanPrefBaca() { try { localStorage.setItem('prefBacaTeks', JSON.stringify(prefBaca)); } catch (e) {} }

        function terapkanPrefBaca() {
            const panel = document.getElementById('panel-teks');
            TEMA_TEKS.forEach(t => panel.classList.remove('tema-' + t));
            if (prefBaca.tema !== 'terang') panel.classList.add('tema-' + prefBaca.tema);
            prefBaca.ukuran = Math.min(Math.max(prefBaca.ukuran, 0), UKURAN_TEKS.length - 1);
            document.getElementById('teks-isi').style.fontSize = UKURAN_TEKS[prefBaca.ukuran] + 'px';
            document.getElementById('btn-font-kecil').disabled = prefBaca.ukuran === 0;
            document.getElementById('btn-font-besar').disabled = prefBaca.ukuran === UKURAN_TEKS.length - 1;
            document.getElementById('tts-kecepatan').value = String(prefBaca.kecepatan);
        }
        function ubahUkuranTeks(d) { prefBaca.ukuran += d; terapkanPrefBaca(); simpanPrefBaca(); }
        function gantiTemaTeks() { prefBaca.tema = TEMA_TEKS[(TEMA_TEKS.indexOf(prefBaca.tema) + 1) % TEMA_TEKS.length]; terapkanPrefBaca(); simpanPrefBaca(); }
        function ubahKecepatanTTS(v) { prefBaca.kecepatan = parseFloat(v) || 1; simpanPrefBaca(); }
        function ubahSuaraTTS(nama) {
            prefBaca.suara = nama; simpanPrefBaca();
            tts.suara = daftarSuaraIndonesia().find(v => v.name === nama) || pilihSuaraIndonesia();
            if (tts.aktif) mulaiTTS(tts.antrian[tts.idx]?.i || 0); // langsung dengar suara baru
        }

        // Pakai pdf.js yang sudah dimuat DearFlip bila ada, agar tidak bentrok.
        function muatPdfJs() {
            const siapkan = lib => { if (!lib.GlobalWorkerOptions.workerSrc) lib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${lib.version || '2.16.105'}/pdf.worker.min.js`; return lib; };
            if (window.pdfjsLib) return Promise.resolve(siapkan(window.pdfjsLib));
            return new Promise((resolve, reject) => {
                const el = document.createElement('script');
                el.src = PDFJS_CDN + 'pdf.min.js';
                el.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_CDN + 'pdf.worker.min.js'; resolve(window.pdfjsLib); };
                el.onerror = () => reject(new Error('Gagal memuat pembaca PDF.'));
                document.head.appendChild(el);
            });
        }

        async function bukaModeTeks() {
            const panel = document.getElementById('panel-teks');
            const isi = document.getElementById('teks-isi');
            document.getElementById('teks-judul').textContent = dataBuku ? dataBuku.judul : '';
            if (ttsDidukung) { document.getElementById('kontrol-tts').classList.remove('hidden'); document.getElementById('kontrol-tts').classList.add('flex'); }
            terapkanPrefBaca();
            panel.classList.remove('hidden');

            if (!pdfTeks) {
                isi.innerHTML = `<div class="text-center py-20" style="color:var(--muted)"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3" style="color:var(--aksen)"></i><p class="font-sans font-medium">Menyiapkan teks modul...</p></div>`;
                try {
                    const lib = await muatPdfJs();
                    pdfTeks = await lib.getDocument(dataBuku.file_url).promise;
                    totalHalTeks = pdfTeks.numPages;
                    document.getElementById('total-hal-teks').textContent = totalHalTeks;
                    document.getElementById('input-hal-teks').max = totalHalTeks;
                } catch (err) {
                    console.error(err);
                    isi.innerHTML = `<div class="text-center py-20 font-sans" style="color:var(--muted)"><i class="fa-solid fa-triangle-exclamation text-3xl mb-3 text-amber-500"></i><p class="font-medium">Teks modul tidak dapat dimuat.</p><p class="text-sm mt-1">Silakan gunakan tampilan flipbook.</p></div>`;
                    return;
                }
            }
            tampilkanHalamanTeks(Math.min(Math.max(halFlipbook, 1), totalHalTeks));
        }

        function tutupModeTeks() {
            hentikanTTS();
            document.getElementById('panel-teks').classList.add('hidden');
        }

        async function ambilTeksHalaman(n) {
            if (cacheTeks[n]) return cacheTeks[n];
            const page = await pdfTeks.getPage(n);
            const konten = await page.getTextContent();
            return (cacheTeks[n] = susunParagraf(konten.items));
        }

        // Ubah potongan teks PDF (per posisi) menjadi baris lalu paragraf.
        function susunParagraf(items) {
            const baris = []; let cur = null;
            items.forEach(it => {
                if (typeof it.str !== 'string' || !it.transform) return;
                const x = it.transform[4], y = it.transform[5];
                const h = Math.abs(it.transform[3]) || it.height || 10;
                if (!cur || Math.abs(y - cur.y) > Math.max(h, cur.h) * 0.6) {
                    cur = { teks: '', y, h, xAkhir: x }; baris.push(cur);
                } else if (cur.teks && !/\s$/.test(cur.teks) && !/^\s/.test(it.str) && x - cur.xAkhir > h * 0.2) {
                    cur.teks += ' ';
                }
                cur.teks += it.str;
                cur.h = Math.max(cur.h, h);
                cur.xAkhir = x + (it.width || 0);
            });

            const tinggi = baris.map(b => b.h).sort((a, b) => a - b);
            const median = tinggi.length ? tinggi[Math.floor(tinggi.length / 2)] : 10;

            const paragraf = []; let p = null; let prev = null;
            const tutup = () => { if (p && p.teks) paragraf.push(p); p = null; };
            baris.forEach(b => {
                const t = b.teks.replace(/\s+/g, ' ').trim();
                if (!t) { tutup(); prev = null; return; }
                const judul = b.h > median * 1.25;
                const pisah = !p || !prev
                    || Math.abs(prev.y - b.y) > prev.h * 1.9
                    || Math.abs(b.h - prev.h) > prev.h * 0.25
                    || p.judul !== judul
                    || /^([•▪●◦\-–]|\d{1,2}[.)])\s/.test(t);
                if (pisah) { tutup(); p = { teks: t, judul }; }
                else p.teks = /-$/.test(p.teks) ? p.teks + t : p.teks + ' ' + t;
                prev = b;
            });
            tutup();
            return paragraf;
        }

        async function tampilkanHalamanTeks(n, opsi = {}) {
            n = Math.min(Math.max(parseInt(n) || 1, 1), totalHalTeks);
            halTeks = n;
            document.getElementById('input-hal-teks').value = n;
            document.getElementById('btn-teks-prev').disabled = n <= 1;
            document.getElementById('btn-teks-next').disabled = n >= totalHalTeks;

            const isi = document.getElementById('teks-isi');
            if (!cacheTeks[n]) isi.innerHTML = `<div class="text-center py-20" style="color:var(--muted)"><i class="fa-solid fa-spinner fa-spin text-2xl" style="color:var(--aksen)"></i></div>`;

            let para;
            try { para = await ambilTeksHalaman(n); } catch (e) { console.error(e); para = []; }
            if (n !== halTeks) return; // pengguna sudah pindah halaman

            let html = `<p class="teks-meta">Halaman ${n} dari ${totalHalTeks}</p>`;
            if (!para.length) {
                html += `<div class="text-center py-16 font-sans" style="color:var(--muted)"><i class="fa-regular fa-image text-4xl mb-3"></i><p class="font-medium">Halaman ini berisi gambar atau hasil pindaian, sehingga teksnya tidak dapat ditampilkan.</p><button onclick="tutupModeTeks()" class="btn-bar mt-4 mx-auto"><i class="fa-solid fa-book-open"></i> Lihat di Flipbook</button></div>`;
            } else {
                html += para.map((pr, i) => pr.judul ? `<h3 data-i="${i}">${escapeHtml(pr.teks)}</h3>` : `<p data-i="${i}">${escapeHtml(pr.teks)}</p>`).join('');
            }
            if (n === totalHalTeks) {
                html += `<div class="mt-10 p-6 rounded-2xl text-center font-sans border" style="border-color:var(--line); background:var(--bar)">
                    <i class="fa-solid fa-flag-checkered text-3xl mb-2" style="color:var(--aksen)"></i>
                    <p class="font-bold mb-4">Anda sudah sampai di halaman terakhir.</p>
                    <button onclick="tampilkanKonfirmasiSelesai()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-md transition"><i class="fa-solid fa-check-double mr-2"></i>Selesai Membaca</button>
                </div>`;
            }
            isi.innerHTML = html;
            isi.classList.toggle('bisa-klik', ttsDidukung && para.length > 0);
            if (!opsi.pertahankanScroll) document.getElementById('teks-scroll').scrollTop = 0;

            if (n < totalHalTeks) ambilTeksHalaman(n + 1).catch(() => {}); // prefetch
            if (opsi.lanjutBaca && tts.aktif) mulaiTTS(0);
        }

        function navHalamanTeks(d) { hentikanTTS(); tampilkanHalamanTeks(halTeks + d); }
        function lompatHalamanTeks(v) { hentikanTTS(); tampilkanHalamanTeks(v); }

        // Klik paragraf = mulai dibacakan dari paragraf tersebut.
        document.addEventListener('click', e => {
            const el = e.target.closest('#teks-isi [data-i]');
            if (el && ttsDidukung) mulaiTTS(parseInt(el.dataset.i));
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && !document.getElementById('panel-teks').classList.contains('hidden')) tutupModeTeks();
        });

        // ---------- Text-to-Speech ----------
        // Suara bahasa Indonesia yang tersedia di perangkat, diurutkan dari yang paling natural.
        // Suara neural ("Natural"/"Online", mis. Microsoft Gadis/Ardi di Edge) dan suara Google
        // jauh lebih alami daripada suara lokal lama (mis. "Damayanti" di Apple).
        function skorSuara(v) {
            let skor = 0;
            if (/natural|neural/i.test(v.name)) skor += 10;
            if (/online/i.test(v.name)) skor += 4;
            if (/google/i.test(v.name)) skor += 5;
            if (/enhanced|premium|siri/i.test(v.name)) skor += 3;
            if (v.localService === false) skor += 1;
            return skor;
        }
        function daftarSuaraIndonesia() {
            return speechSynthesis.getVoices()
                .filter(v => /^id([-_]|$)/i.test(v.lang) || /indonesia/i.test(v.name))
                .sort((a, b) => skorSuara(b) - skorSuara(a));
        }
        function pilihSuaraIndonesia() {
            const daftar = daftarSuaraIndonesia();
            return daftar.find(v => v.name === prefBaca.suara) || daftar[0] || null;
        }
        function isiPilihanSuara() {
            const daftar = daftarSuaraIndonesia(), sel = document.getElementById('tts-suara');
            tts.suara = pilihSuaraIndonesia();
            sel.innerHTML = daftar.map(v => `<option value="${escapeHtml(v.name)}">${escapeHtml(v.name.replace(/\s*[-–(].*indones.*$/i, '').replace(/^(Microsoft|Google)\s+/, '') + (skorSuara(v) >= 5 ? ' ★' : ''))}</option>`).join('');
            sel.classList.toggle('sm:block', daftar.length > 1);
            if (tts.suara) sel.value = tts.suara.name;
        }
        if (ttsDidukung) {
            isiPilihanSuara();
            speechSynthesis.addEventListener('voiceschanged', isiPilihanSuara);
            window.addEventListener('pagehide', () => speechSynthesis.cancel());
        }

        // Potong teks panjang per kalimat (beberapa browser memutus ucapan yang terlalu panjang).
        function potongKalimat(teks) {
            const kalimat = teks.match(/[^.!?;:]+[.!?;:]*\s*/g) || [teks];
            const hasil = []; let buf = '';
            kalimat.forEach(k => { if (buf && (buf + k).length > 220) { hasil.push(buf.trim()); buf = ''; } buf += k; });
            if (buf.trim()) hasil.push(buf.trim());
            return hasil;
        }

        function mulaiTTS(dariParagraf = 0) {
            if (!ttsDidukung) return;
            const para = cacheTeks[halTeks] || [];
            speechSynthesis.cancel();
            tts.sesi++;
            if (!para.length) {
                if (halTeks < totalHalTeks) { tts.aktif = true; updateTombolTTS(); return tampilkanHalamanTeks(halTeks + 1, { lanjutBaca: true }); }
                return hentikanTTS();
            }
            tts.aktif = true; tts.jeda = false;
            tts.antrian = [];
            para.forEach((pr, i) => { if (i >= dariParagraf) potongKalimat(pr.teks).forEach(k => tts.antrian.push({ i, k })); });
            tts.idx = 0;
            updateTombolTTS();
            ucapkanBerikut(tts.sesi);
        }

        function ucapkanBerikut(sesi) {
            if (!tts.aktif || sesi !== tts.sesi) return;
            if (tts.idx >= tts.antrian.length) {
                tandaiParagraf(null);
                if (halTeks < totalHalTeks) tampilkanHalamanTeks(halTeks + 1, { lanjutBaca: true });
                else hentikanTTS();
                return;
            }
            const { i, k } = tts.antrian[tts.idx];
            tandaiParagraf(i);
            const u = new SpeechSynthesisUtterance(k);
            u.lang = 'id-ID';
            if (tts.suara) u.voice = tts.suara;
            u.rate = prefBaca.kecepatan || 1;
            u.onend = () => { if (sesi !== tts.sesi) return; tts.idx++; ucapkanBerikut(sesi); };
            u.onerror = e => { if (sesi !== tts.sesi || e.error === 'interrupted' || e.error === 'canceled') return; tts.idx++; ucapkanBerikut(sesi); };
            speechSynthesis.speak(u);
        }

        function toggleTTS() {
            if (!tts.aktif) return mulaiTTS(0);
            if (tts.jeda) { speechSynthesis.resume(); tts.jeda = false; }
            else { speechSynthesis.pause(); tts.jeda = true; }
            updateTombolTTS();
        }

        function hentikanTTS() {
            tts.aktif = false; tts.jeda = false; tts.sesi++;
            if (ttsDidukung) speechSynthesis.cancel();
            tandaiParagraf(null);
            updateTombolTTS();
        }

        function tandaiParagraf(i) {
            document.querySelectorAll('#teks-isi .sedang-dibaca').forEach(el => el.classList.remove('sedang-dibaca'));
            if (i === null) return;
            const el = document.querySelector(`#teks-isi [data-i="${i}"]`);
            if (el) { el.classList.add('sedang-dibaca'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        }

        function updateTombolTTS() {
            const btn = document.getElementById('btn-tts');
            const berbicara = tts.aktif && !tts.jeda;
            btn.classList.toggle('aktif', tts.aktif);
            btn.innerHTML = berbicara
                ? '<i class="fa-solid fa-pause"></i><span class="hidden sm:inline">Jeda</span>'
                : `<i class="fa-solid ${tts.aktif ? 'fa-play' : 'fa-volume-high'}"></i><span class="hidden sm:inline">${tts.aktif ? 'Lanjutkan' : 'Bacakan'}</span>`;
            document.getElementById('btn-tts-stop').classList.toggle('hidden', !tts.aktif);
        }

        // =====================================================
        // PEMBACA MODUL SLIDE
        // Tata letak otomatis: potret (HP/layar tegak) atau lanskap (desktop).
        // Narasi: audio MP3 suara neural dari admin; jika belum ada, pakai suara perangkat.
        // =====================================================
        const sl = { daftar: [], idx: 0, main: false, audio: new Audio(), sesi: 0 };

        async function mulaiModeSlide() {
            document.getElementById('wadah-buku').classList.add('hidden');
            const { data, error } = await supabaseClient.from('slide').select('*').eq('id_buku', bookId).order('urutan', { ascending: true });
            if (error || !data || !data.length) { await Dialog.alert('Modul slide ini belum memiliki isi.'); return keluarKeBeranda(); }
            sl.daftar = data;
            document.getElementById('wadah-slide').classList.remove('hidden');
            tampilSlide(0);

            window.addEventListener('resize', () => tampilSlide(sl.idx, true));
            document.addEventListener('keydown', e => {
                if (document.getElementById('wadah-slide').classList.contains('hidden')) return;
                if (!document.getElementById('modalSelesai').classList.contains('hidden')) return;
                if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); geserSlide(1); }
                else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); geserSlide(-1); }
                else if (e.key === ' ') { e.preventDefault(); toggleNarasi(); }
            });
            // Geser (swipe) di layar sentuh
            let awal = null;
            const panggung = document.getElementById('sl-bingkai');
            panggung.addEventListener('touchstart', e => { const t = e.touches[0]; awal = { x: t.clientX, y: t.clientY }; }, { passive: true });
            panggung.addEventListener('touchend', e => {
                if (!awal) return;
                const t = e.changedTouches[0], dx = t.clientX - awal.x, dy = t.clientY - awal.y;
                awal = null;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) geserSlide(dx < 0 ? 1 : -1);
            }, { passive: true });
            sl.audio.addEventListener('ended', () => selesaiNarasi(sl.sesi));
        }

        function tampilSlide(i, hanyaTataLetak) {
            const total = sl.daftar.length;
            sl.idx = Math.max(0, Math.min(i, total - 1));
            const data = sl.daftar[sl.idx];
            SlideRender.render(document.getElementById('sl-panggung'), data, SlideRender.orientasiLayar(), { nomor: sl.idx + 1, total });
            if (hanyaTataLetak) return;

            document.getElementById('sl-progres').style.width = ((sl.idx + 1) / total * 100) + '%';
            document.getElementById('sl-hitung').textContent = `${sl.idx + 1} / ${total}`;
            document.getElementById('sl-prev').disabled = sl.idx === 0;
            const terakhir = sl.idx === total - 1;
            document.getElementById('sl-next').innerHTML = terakhir ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-chevron-right"></i>';
            document.getElementById('sl-next').classList.toggle('!bg-emerald-600', terakhir);
            const btnSelesai = document.getElementById('btn-selesai');
            btnSelesai.classList.toggle('hidden', !terakhir); btnSelesai.classList.toggle('flex', terakhir);

            // Muat gambar slide berikutnya lebih dulu
            const berikut = sl.daftar[sl.idx + 1];
            if (berikut && berikut.gambar_url) { const img = new Image(); img.src = berikut.gambar_url; }
            if (sl.main) putarNarasi();
        }

        function geserSlide(arah) {
            if (arah > 0 && sl.idx === sl.daftar.length - 1) { hentikanNarasi(); return tampilkanKonfirmasiSelesai(); }
            if (arah < 0 && sl.idx === 0) return;
            tampilSlide(sl.idx + arah);
        }

        function putarNarasi() {
            const data = sl.daftar[sl.idx], sesi = ++sl.sesi;
            sl.audio.pause();
            if (ttsDidukung) speechSynthesis.cancel();
            sl.main = true; perbaruiTombolPlay();
            if (data.audio_url) {
                sl.audio.src = data.audio_url;
                sl.audio.play().catch(() => { sl.main = false; perbaruiTombolPlay(); });
            } else if (ttsDidukung) {
                const u = new SpeechSynthesisUtterance(SlideRender.teksUcapan(data));
                u.lang = 'id-ID';
                const suara = pilihSuaraIndonesia(); if (suara) u.voice = suara;
                u.rate = prefBaca.kecepatan || 1;
                u.onend = () => selesaiNarasi(sesi);
                speechSynthesis.speak(u);
            } else { sl.main = false; perbaruiTombolPlay(); }
        }

        function selesaiNarasi(sesi) {
            if (sesi !== sl.sesi || !sl.main) return;
            const otomatis = document.getElementById('sl-otomatis').checked;
            if (otomatis && sl.idx < sl.daftar.length - 1) setTimeout(() => { if (sesi === sl.sesi && sl.main) tampilSlide(sl.idx + 1); }, 700);
            else { sl.main = false; perbaruiTombolPlay(); if (otomatis && sl.idx === sl.daftar.length - 1) tampilkanKonfirmasiSelesai(); }
        }

        function hentikanNarasi() {
            sl.main = false; sl.sesi++;
            sl.audio.pause();
            if (ttsDidukung) speechSynthesis.cancel();
            perbaruiTombolPlay();
        }

        function toggleNarasi() { sl.main ? hentikanNarasi() : putarNarasi(); }

        function perbaruiTombolPlay() {
            const b = document.getElementById('sl-play');
            if (b) b.innerHTML = sl.main ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play ml-0.5"></i>';
        }
    </script>
</body>
